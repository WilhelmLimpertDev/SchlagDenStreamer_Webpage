<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twelfthlion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">

  <style>
    .font-brand {
      font-family: 'Teko', sans-serif;
      letter-spacing: 2px;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between items-center selection:bg-yellow-500 selection:text-black">

  <!-- Platzhalter oben für gleichmäßige Zentrierung -->
  <div></div>

  <!-- ZENTRALER INHALT: LOGO & LOGIN-BUTTON -->
  <main class="w-full max-w-md px-6 text-center flex flex-col items-center">
    
    <!-- LOGO BEREICH -->
    <div class="mb-8 relative group">
      <!-- Schein-Effekt -->
      <div class="absolute -inset-4 bg-gradient-to-r from-amber-500/20 via-orange-500/20 to-yellow-500/20 rounded-full blur-2xl opacity-75 group-hover:opacity-100 transition duration-500"></div>

      <!-- Logo Bild -->
      <img 
        src="/Grafik/logo_twelfthlion_gemini_ai.png" 
        alt="Twelfthlion Logo" 
        class="relative w-56 md:w-64 h-auto mx-auto drop-shadow-[0_10px_25px_rgba(0,0,0,0.8)] object-contain transition-transform duration-300 group-hover:scale-105"
        onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'240\' height=\'240\' viewBox=\'0 0 240 240\'><rect width=\'240\' height=\'240\' rx=\'32\' fill=\'%23111827\' stroke=\'%23eab308\' stroke-width=\'4\'/><text x=\'50%25\' y=\'55%25\' font-size=\'42\' font-weight=\'bold\' fill=\'%23eab308\' font-family=\'sans-serif\' text-anchor=\'middle\'>TWELFTHLION</text></svg>';"
      >
    </div>

    <!-- BRAND TITEL -->
    <h1 class="font-brand text-4xl md:text-5xl uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 mb-6">
      Twelfthlion
    </h1>

    <!-- BUTTON ZUM ÖFFNEN DES PIN-MODALS -->
    <button 
      onclick="openPinModal()" 
      class="group inline-flex items-center gap-3 px-8 py-3.5 rounded-xl bg-gray-900 border border-amber-500/40 hover:border-amber-400 text-white font-bold text-base transition-all duration-300 hover:shadow-[0_0_25px_rgba(245,158,11,0.25)] hover:scale-105 active:scale-95 cursor-pointer"
    >
      <span class="tracking-wide">Login Schlag den Streamer</span>
      <svg class="w-5 h-5 text-amber-400 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </button>

  </main>

  <!-- ================= PIN MODAL DIALOG ================= -->
  <div id="pin-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl text-center w-full max-w-sm relative">
      
      <!-- Schließen Button -->
      <button onclick="closePinModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 text-lg">✕</button>

      <div class="w-12 h-12 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
        🔒
      </div>

      <h2 class="text-xl font-bold mb-1 text-white">Schlag den Streamer</h2>
      <p class="text-xs text-gray-400 mb-5">Bitte PIN eingeben, um fortzufahren.</p>

      <input 
        type="password" 
        id="modal-pin-input" 
        placeholder="PIN" 
        class="w-full text-center text-2xl tracking-widest p-3 rounded-lg bg-gray-800 border border-gray-700 text-white mb-3 focus:outline-none focus:border-amber-400"
        onkeydown="if(event.key==='Enter') submitPin()"
      >

      <p id="pin-error" class="hidden text-red-400 text-xs mb-4 font-semibold">Falsche PIN. Bitte erneut versuchen.</p>

      <div class="grid grid-cols-2 gap-2 mt-2">
        <button onclick="closePinModal()" class="py-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-semibold transition-colors">
          Abbrechen
        </button>
        <button onclick="submitPin()" class="py-2.5 rounded-lg bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 text-sm font-extrabold shadow-lg transition-transform active:scale-95">
          Bestätigen
        </button>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="py-6 text-center text-xs text-gray-500">
    <p>© 2026 twelfthlion.com</p>
  </footer>

  <script>
    const ACCESS_PIN = "1234";

    function openPinModal() {
      const modal = document.getElementById("pin-modal");
      const input = document.getElementById("modal-pin-input");
      const err = document.getElementById("pin-error");

      err.classList.add("hidden");
      input.value = "";
      modal.classList.remove("hidden");
      input.focus();
    }

    function closePinModal() {
      document.getElementById("pin-modal").classList.add("hidden");
    }

    function submitPin() {
      const pin = document.getElementById("modal-pin-input").value;
      if (pin === ACCESS_PIN) {
        window.location.href = "/scoreboard.html";
      } else {
        document.getElementById("pin-error").classList.remove("hidden");
        document.getElementById("modal-pin-input").value = "";
        document.getElementById("modal-pin-input").focus();
      }
    }
  </script>

</body>
</html>
