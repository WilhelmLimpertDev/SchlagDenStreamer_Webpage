<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Teko:wght@700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">

  <style>
    .font-digital {
      font-family: 'Orbitron', monospace;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }
    .font-header {
      font-family: 'Teko', sans-serif;
      letter-spacing: 2px;
    }
    .font-game {
      font-family: 'Chakra Petch', sans-serif;
    }
    .card-perspective {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 0.75rem;
    }
    .card-flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .matrix-bg {
      background-color: #0d1117;
      background-image: radial-gradient(#1f2937 15%, transparent 16%);
      background-size: 6px 6px;
    }
    .gold-chassis {
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    }

    body.bg-default {
      background-color: rgb(15 23 42 / 0.9);
    }
    body.bg-greenscreen {
      background-color: #00ff00 !important;
    }
    body.bg-transparent-mode {
      background-color: transparent !important;
    }
  </style>
</head>
<body id="page-body" class="bg-default min-h-screen text-white flex flex-col items-center justify-between p-6 select-none overflow-hidden">

  <!-- PIN AUTH DIALOG -->
  <div id="auth-box" class="fixed inset-0 z-50 bg-gray-950 flex items-center justify-center">
    <div class="bg-gray-800 border border-gray-700 p-8 rounded-2xl shadow-2xl text-center w-80">
      <h2 class="text-2xl font-bold mb-4 font-header tracking-wider">Scoreboard PIN</h2>
      <input type="password" id="pin-input" placeholder="PIN eingeben" class="w-full text-center text-xl tracking-widest p-3 rounded-lg bg-gray-900 border border-gray-600 text-white mb-4 focus:outline-none focus:border-yellow-400" onkeydown="if(event.key==='Enter') checkPin()">
      <button onclick="checkPin()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold py-3 rounded-lg transition-colors uppercase tracking-wider">Freischalten</button>
    </div>
  </div>

  <!-- HAUPT-CONTAINER -->
  <main id="scoreboard-container" class="hidden w-full max-w-6xl flex flex-col items-center justify-center my-auto gap-8">
    
    <!-- 1. OBERES DRITTEL: 7 SPIELKARTEN MIT SPIELNAMEN -->
    <header class="w-full flex justify-center items-center gap-3 card-perspective min-h-[140px]">
      <div id="cards-wrapper" class="flex gap-2.5 md:gap-3.5 w-full justify-center"></div>
    </header>

    <!-- 2. MITTLERES DRITTEL: TAFEL -->
    <section class="w-full max-w-4xl gold-chassis p-4 md:p-6 rounded-3xl border-4 border-white/70">
      <div class="grid grid-cols-2 gap-4 md:gap-8">
        
        <!-- Streamer: Oldmanstuff -->
        <article class="flex flex-col items-center">
          <h2 class="font-header text-3xl md:text-5xl uppercase tracking-wider text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
            Oldmanstuff
          </h2>
          <div class="w-full h-36 md:h-44 matrix-bg rounded-xl border-4 border-gray-900 shadow-inner flex items-center justify-center relative overflow-hidden mt-1">
            <span id="score-streamer" class="font-digital text-7xl md:text-8xl font-black text-amber-400 tracking-wider">00</span>
          </div>
          <div class="flex gap-1.5 md:gap-2 mt-3" id="rounds-streamer"></div>
        </article>

        <!-- Chat: Kuhmunity -->
        <article class="flex flex-col items-center">
          <h2 class="font-header text-3xl md:text-5xl uppercase tracking-wider text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
            Kuhmunity
          </h2>
          <div class="w-full h-36 md:h-44 matrix-bg rounded-xl border-4 border-gray-900 shadow-inner flex items-center justify-center relative overflow-hidden mt-1">
            <span id="score-chat" class="font-digital text-7xl md:text-8xl font-black text-amber-400 tracking-wider">00</span>
          </div>
          <div class="flex gap-1.5 md:gap-2 mt-3" id="rounds-chat"></div>
        </article>

      </div>
    </section>

  </main>

  <script>
    const VALID_PIN = "1234";
    const TOTAL_ROUNDS = 7;
    const bodyEl = document.getElementById("page-body");
    const urlParams = new URLSearchParams(window.location.search);

    const GAMES_LIST = [
      { round: 1, name: "Jackbox: Fibbage", tag: null },
      { round: 2, name: "Lach-Challenge", tag: null },
      { round: 3, name: "Jackbox: Quiplash", tag: null },
      { round: 4, name: "Stadt, Land, Fluss", tag: null },
      { round: 5, name: "2. Lach-Challenge", tag: null },
      { round: 6, name: "Jackbox: Survey Scramble", tag: null },
      { round: 7, name: "Quiz", tag: "Finales Game" }
    ];

    if (urlParams.has("green")) {
      bodyEl.classList.remove("bg-default");
      bodyEl.classList.add("bg-greenscreen");
    } else if (urlParams.has("transparent")) {
      bodyEl.classList.remove("bg-default");
      bodyEl.classList.add("bg-transparent-mode");
    }

    const cardsWrapper = document.getElementById("cards-wrapper");
    GAMES_LIST.forEach((game) => {
      const r = game.round;
      const badgeHtml = game.tag 
        ? `<span class="bg-red-600 text-white text-[8px] font-black uppercase px-1.5 py-0.5 rounded-full mb-1 tracking-wider shadow animate-pulse">${game.tag}</span>` 
        : '';

      cardsWrapper.innerHTML += `
        <div id="card-${r}" class="w-24 md:w-32 h-32 md:h-36 card-inner">
          
          <!-- Vorderseite (Verdeckt) -->
          <div class="card-front bg-gradient-to-br from-blue-700 via-indigo-800 to-slate-900 border-2 border-white/40 shadow-lg flex flex-col items-center justify-between p-2">
            <span class="text-[10px] text-blue-200/80 font-bold uppercase tracking-wider">Runde ${r}</span>
            <div class="w-10 h-14 border border-dashed border-white/30 rounded-lg flex items-center justify-center">
              <span class="text-white/40 font-bold text-base">?</span>
            </div>
            <span class="text-[9px] font-bold text-amber-400">${r} ${r === 1 ? 'Punkt' : 'Punkte'}</span>
          </div>

          <!-- Rückseite (Aufgedeckt) -->
          <div class="card-back bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 border-2 border-white shadow-xl flex flex-col items-center justify-between p-2 text-slate-950 text-center">
            <div class="flex flex-col items-center w-full">
              <span class="text-[9px] font-extrabold uppercase tracking-wider text-slate-800">Runde ${r}</span>
              ${badgeHtml}
            </div>

            <div class="font-game font-bold text-xs md:text-sm leading-tight text-slate-950 px-1 py-0.5">
              ${game.name}
            </div>

            <div class="w-full border-t border-amber-600/40 pt-1">
              <span class="font-digital text-[10px] font-black text-slate-900 tracking-wider">
                +${r} ${r === 1 ? 'PKT' : 'PKTE'}
              </span>
            </div>
          </div>

        </div>
      `;
    });

    function generateRoundSlots(elementId, prefix) {
      const el = document.getElementById(elementId);
      for (let r = 1; r <= TOTAL_ROUNDS; r++) {
        el.innerHTML += `
          <div id="${prefix}-${r}" class="w-6 h-6 md:w-8 md:h-8 rounded bg-gray-950 border border-gray-700 flex items-center justify-center text-xs font-bold text-gray-500 transition-all duration-300">
            ${r}
          </div>
        `;
      }
    }
    generateRoundSlots("rounds-streamer", "streamer-r");
    generateRoundSlots("rounds-chat", "chat-r");

    function unlockUI() {
      document.getElementById("auth-box").classList.add("hidden");
      document.getElementById("scoreboard-container").classList.remove("hidden");
      connectWebSocket();
    }

    function checkPin() {
      const pin = document.getElementById("pin-input").value;
      if (pin === VALID_PIN) {
        unlockUI();
      } else {
        alert("Falsche PIN!");
      }
    }

    if (urlParams.has("nopin")) {
      unlockUI();
    }

function connectWebSocket() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws`;
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          renderState(data); // bzw. updateUI(data) in host.html
        } catch (e) {
          console.error("Datenverarbeitungsfehler:", e);
        }
      };

      ws.onerror = (err) => {
        console.warn("WebSocket Fehler aufgetreten:", err);
      };

      ws.onclose = () => {
        // Bei Verbindungsunterbrechung alle 2 Sekunden automatisch neu versuchen
        setTimeout(connectWebSocket, 2000);
      };
    }

    function renderState(state) {
      document.getElementById("score-streamer").innerText = String(state.score_streamer).padStart(2, '0');
      document.getElementById("score-chat").innerText = String(state.score_chat).padStart(2, '0');

      const currentRound = Math.min(Math.max(1, state.round), TOTAL_ROUNDS);

      for (let r = 1; r <= TOTAL_ROUNDS; r++) {
        const card = document.getElementById(`card-${r}`);
        if (r <= currentRound) {
          card.classList.add("card-flipped");
        } else {
          card.classList.remove("card-flipped");
        }
      }

      if (state.round_history) {
        for (let r = 1; r <= TOTAL_ROUNDS; r++) {
          const outcome = state.round_history[String(r)];
          const stBox = document.getElementById(`streamer-r-${r}`);
          const chBox = document.getElementById(`chat-r-${r}`);

          const defaultClass = "w-6 h-6 md:w-8 md:h-8 rounded bg-gray-950 border border-gray-700 flex items-center justify-center text-xs font-bold text-gray-500 transition-all duration-300";

          if (outcome === "streamer") {
            stBox.className = "w-6 h-6 md:w-8 md:h-8 rounded bg-green-500 text-black font-black border border-white flex items-center justify-center text-xs shadow-md";
            chBox.className = "w-6 h-6 md:w-8 md:h-8 rounded bg-red-950/80 text-red-400/60 border border-red-900/60 flex items-center justify-center text-xs";
          } else if (outcome === "chat") {
            stBox.className = "w-6 h-6 md:w-8 md:h-8 rounded bg-red-950/80 text-red-400/60 border border-red-900/60 flex items-center justify-center text-xs";
            chBox.className = "w-6 h-6 md:w-8 md:h-8 rounded bg-green-500 text-black font-black border border-white flex items-center justify-center text-xs shadow-md";
          } else {
            stBox.className = defaultClass;
            chBox.className = defaultClass;
          }
        }
      }
    }
  </script>
</body>
</html>
